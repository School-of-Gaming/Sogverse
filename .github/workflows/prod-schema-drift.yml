name: Production Schema Drift

# Answers the one question supabase/schema.sql deliberately does not: has the
# production database been changed outside migration history?
#
# The snapshot is built from migrations/ and CI fails when the committed copy
# disagrees, so schema.sql is a trustworthy statement of what the migrations
# produce. That says nothing about what production actually looks like. In July
# 2026 production carried two admin policies that no migration created, and it was
# found only because somebody ran a dump by hand. This is that dump, on a timer.
#
# Scope note: production only. Staging carries known cosmetic drift (a column
# ordinal that cannot be corrected without rebuilding the table), so including it
# would mean a permanently red check — and staging cannot leak into anything
# committed now that the snapshot is built from migrations.

on:
  schedule:
    # 06:00 UTC daily. Drift is not urgent to the minute; what matters is that a
    # hand-edit surfaces within a day rather than at the next release.
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  drift:
    name: Compare production against the migrations snapshot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Runners ship a PostgreSQL 16 client, and pg_dump refuses outright to dump a
      # server newer than itself — production is 17.6. Pinning 17 here also matches
      # the client that produced schema.sql (pg_dump runs inside the local Postgres
      # 17 container in the Database Tests job), so the two dumps are directly
      # comparable instead of differing by client-version formatting.
      - name: Install PostgreSQL 17 client
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17
          pg_dump --version

      - name: Dump the production public schema
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_PROD_DB_PASSWORD }}
          PROD_REF: ${{ secrets.SUPABASE_PROD_PROJECT_REF }}
        run: |
          # Session pooler (5432), not the transaction pooler (6543) — pg_dump needs
          # a session. Same flags and \restrict strip as the snapshot, so any
          # difference is schema, not invocation.
          pg_dump -h aws-1-eu-north-1.pooler.supabase.com -p 5432 \
            -U "postgres.${PROD_REF}" -d postgres \
            --schema=public --schema-only --no-owner \
            | grep -vE '^[\](un)?restrict ' > /tmp/prod-schema.sql
          echo "dumped $(wc -l < /tmp/prod-schema.sql) lines"
          # A dump that "succeeds" but is empty or truncated would otherwise read as
          # catastrophic drift and bury the real signal.
          for obj in "CREATE TABLE" "CREATE POLICY" "CREATE TRIGGER" "GRANT"; do
            n=$(grep -c "^$obj" /tmp/prod-schema.sql || true)
            if [ "$n" -eq 0 ]; then
              echo "::error::production dump contains no '$obj' statements — treating as a failed dump, not as drift"
              exit 1
            fi
          done

      - name: Upload the production dump
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: prod-schema
          path: /tmp/prod-schema.sql
          retention-days: 30

      - name: Compare against the migrations-built snapshot
        run: |
          # Both dumps record the client and server versions in their header. Those
          # are properties of where the dump ran, not of the schema.
          norm() { grep -vE '^-- Dumped (by pg_dump|from database) version ' "$1"; }

          if diff -u <(norm supabase/schema.sql) <(norm /tmp/prod-schema.sql) \
               --label "supabase/schema.sql (from migrations)" \
               --label "production (live)"; then
            echo "No drift — production matches migration history."
            exit 0
          fi

          echo "::error::Production schema differs from what migrations/ produces."
          echo "Every difference above is something applied to production outside migration history."
          echo "Policy and grant differences are the ones that can affect access; treat those first."
          echo "The full production dump is attached to this run as the 'prod-schema' artifact."
          exit 1
