name: CI

# Renaming or removing a job here has TWO twin edits OUTSIDE the repo, both of
# which list checks by the job's display name with nothing linking them back:
#
#   1. GitHub branch protection on main (repo Settings -> Branches): a required
#      check whose job no longer runs blocks every future release PR.
#   2. Vercel Deployment Checks (Vercel project Settings -> Deployment Checks):
#      gates promoting a production deployment. A listed check that never reports
#      leaves the deployment READY but STAGED forever — the build succeeds, prod
#      keeps serving the old code, and because the migrations job doesn't wait
#      for promotion, prod runs OLD code against the NEW schema until someone
#      notices. A deployment snapshots the gate list at creation time, so fixing
#      the settings does not unstick an already-staged deployment; that needs a
#      manual promote (`vercel promote <url>`).
#
# Neither surfaces on dev — both only bite at the next merge into main, weeks
# after the rename lands. (The e2e -> Build & Smoke conversion tripped both on
# the 2026-08-10 release.) Update both in the same change that renames the job.

on:
  push:
  pull_request:
  workflow_dispatch:

# Read-only by default so the write grant on test-db (for the dev-only schema
# snapshot commit) is an actual narrowing. Without this the repository default
# applies to every job, and on a repo set to "read and write" the lint, test,
# build-smoke and deploy jobs would each hold contents:write for no reason.
permissions:
  contents: read

env:
  # Single source of truth for the Supabase CLI version used by every job below.
  # Pinned (not `latest`) on purpose: `latest` makes supabase/setup-cli resolve the
  # newest release via the GitHub API at runtime, and that lookup intermittently
  # rate-limits / times out / hangs — which is a CI flake unrelated to our code.
  # This must stay >= the v2.106.0 floor the DB-grants regime depends on (see
  # CLAUDE.md "Function & Table Access Control"). Bump it when the local dev CLI is
  # upgraded (keep CI == what we run migrations against locally); check the newest
  # stable with `gh api repos/supabase/cli/releases/latest`.
  SUPABASE_CLI_VERSION: "2.106.0"

  # `npm ci` installs every workspace, including services/bedrock-portal, whose
  # bedrock-protocol -> raknet-native dependency resolves prebuilds by
  # platform-kernelmajor-arch and only ships linux-5-x64 — the runner image is on
  # kernel 6, so its install script compiles RakNet from source on every job. That
  # build downloads Node headers from nodejs.org, and when the fetch flakes it reds
  # the run. No job here loads the binary (type-check reads its .d.ts, no test
  # imports it), so skip dependency install scripts outright.
  #
  # If you add a dependency that DOES need its install script, CI fails with a
  # missing-native-module error that reads like a bug in your code — it is this
  # flag. Unset it for that job, or use a package that ships a usable prebuild.
  #
  # Must stay CI-only: never move this into a committed .npmrc. That file travels
  # to the GCE box in services/bedrock-portal/DEPLOY.md, where the portal does need
  # the compiled binary at runtime.
  NPM_CONFIG_IGNORE_SCRIPTS: "true"

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Check translations
        run: npm run check-translations

      - name: Run linting
        run: npm run lint

      - name: Run type check
        run: npm run type-check

  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test -- --coverage

      - name: Upload coverage reports
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  # The only job that builds the app, and the only one that exercises a real
  # served production build: the smoke spec asserts the security headers and the
  # per-request CSP nonce against actual HTTP responses from `npm run start`.
  # Playwright is used purely as an HTTP client here (its request fixture), so no
  # browser binaries are installed and none are needed.
  build-smoke:
    name: Build & Smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_DAILY_DOMAIN: ${{ secrets.NEXT_PUBLIC_DAILY_DOMAIN }}
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}

      - name: Run smoke tests
        run: npm run test:smoke
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_DAILY_DOMAIN: ${{ secrets.NEXT_PUBLIC_DAILY_DOMAIN }}
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}

  test-db:
    name: Database Tests
    runs-on: ubuntu-latest
    # Needed only by the dev-only snapshot commit at the end of this job.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      # The DB tests only exercise Postgres via PostgREST + GoTrue (see
      # tests/db/helpers.ts) — so only those two, kong (which routes to them),
      # postgres itself, and supavisor (the pooler fronting the exposed db port the
      # CLI applies migrations through) get to boot. Everything else is excluded:
      #
      # - edge-runtime is the flaky one — its boot-time Deno download intermittently
      #   fails the tail-end health check with `Error status 502` (known upstream
      #   flake: supabase/cli #3775, #2893, #4535) and fails the whole job on a
      #   container the tests never touch. --ignore-health-check is the documented
      #   backstop for that 502; the kept containers come up fine.
      # - realtime, storage-api, postgres-meta, mailpit, studio, imgproxy, vector,
      #   logflare are simply unused. Mailpit is safe to drop because local auth
      #   autoconfirms (enable_confirmations = false in supabase/config.toml), so
      #   GoTrue never contacts SMTP on any path a test exercises.
      #
      # Together the exclusions cut boot from ~5 min (full stack) to well under it;
      # the full-stack baseline and per-container drift move around with runner
      # weather, so treat the step's own timing in the run as the current number.
      - name: Start local Supabase
        run: supabase start -x edge-runtime,studio,imgproxy,vector,logflare,realtime,storage-api,postgres-meta,mailpit --ignore-health-check

      - name: Run database tests
        run: npm run test:db
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0
          SUPABASE_SERVICE_ROLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU

      # supabase/schema.sql is regenerated here, from the stack `supabase start`
      # just built out of migrations/ — not dumped from any long-lived database.
      # That is the whole point: a hosted database can be (and has been) edited
      # outside migrations, and dumping the snapshot from one lets that drift into
      # the committed file, where it then reads as authoritative. Built from
      # migrations, the snapshot is faithful by construction.
      #
      # pg_dump runs INSIDE the database container, for two reasons. Its client
      # version then always matches the server the CLI booted (a host pg_dump older
      # than the server refuses to run at all, and the runner's version is not ours
      # to pin). And it is raw pg_dump: `supabase db dump` silently emits no
      # CREATE TRIGGER at all — verified, 0 against 26 — so using it would have
      # quietly dropped every trigger from the snapshot while leaving policies,
      # grants and functions intact enough to look right.
      - name: Regenerate schema snapshot from migrations
        run: |
          # pipefail matters here specifically: the dump is a pipeline into grep, and
          # without it the exit status is grep's. A pg_dump that dies mid-stream would
          # still "succeed" so long as one line reached the file — and on dev this file
          # is committed unattended. The object-class guard below catches the usual
          # shape of that (policies and grants are emitted late, so truncation trips
          # it), but it is a backstop, not the check.
          set -euo pipefail
          CONTAINER=$(docker ps --filter "name=supabase_db_" --format '{{.Names}}' | head -1)
          if [ -z "$CONTAINER" ]; then
            echo "::error::supabase db container not found; cannot regenerate the schema snapshot"
            exit 1
          fi
          echo "dumping from $CONTAINER"
          docker exec "$CONTAINER" pg_dump -U postgres -d postgres \
            --schema=public --schema-only --no-owner \
            | grep -vE '^[\](un)?restrict ' > /tmp/schema-from-migrations.sql
          echo "wrote $(wc -l < /tmp/schema-from-migrations.sql) lines"
          # Cheap guard against a dump that "succeeds" but lost an object class.
          for obj in "CREATE TABLE" "CREATE POLICY" "CREATE TRIGGER" "GRANT"; do
            n=$(grep -c "^$obj" /tmp/schema-from-migrations.sql || true)
            echo "$obj: $n"
            if [ "$n" -eq 0 ]; then
              echo "::error::regenerated snapshot contains no '$obj' statements — refusing to treat it as authoritative"
              exit 1
            fi
          done

      - name: Upload regenerated snapshot
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: schema-from-migrations
          path: /tmp/schema-from-migrations.sql
          retention-days: 30
          # When the tests fail the dump never runs, and a missing-file warning
          # stacked on top of the real failure only obscures it.
          if-no-files-found: ignore

      # schema.sql is machine-maintained: nobody writes it by hand, so CI commits it
      # rather than failing and asking someone to. Only on dev, and deliberately not
      # on feature branches — a branch that regenerated it would put a 6000-line
      # generated file into every migration diff, and two branches doing so would
      # conflict on it constantly. Keeping it to dev also means the file tracks
      # *merged* migrations, so an unmerged branch's objects never leak into it.
      #
      # The commit message carries a skip-ci marker so it does not trigger another
      # run; that run would have nothing to do, since the next pass finds the file
      # already matching.
      #
      # The commit is built on whatever dev is at *now*, not on the SHA this job
      # checked out. Pushes to dev are direct and frequent here, and a job that
      # committed onto its own checkout would be rejected as a non-fast-forward
      # whenever anything landed during the two-to-four minutes it was running —
      # surfacing as a red Database Tests job with every test passing, which is the
      # kind of failure people learn to ignore. Re-basing is not available: the
      # checkout is shallow (fetch-depth 1), so there is no history to rebase onto.
      # Fetching dev and committing onto FETCH_HEAD sidesteps both problems.
      #
      # If it still loses a race, that is not fatal and must not fail the job: the
      # file is regenerated from scratch on every run, so the next schema-changing
      # push to dev repairs it. It warns instead, so a persistent failure is still
      # visible rather than silent.
      - name: Commit the regenerated snapshot (dev only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        run: |
          set -euo pipefail
          git fetch --depth=1 origin dev
          if diff -q <(git show FETCH_HEAD:supabase/schema.sql) /tmp/schema-from-migrations.sql > /dev/null; then
            echo "schema.sql on dev already matches migrations — nothing to commit"
            exit 0
          fi
          echo "schema.sql on dev is out of date with migrations; updating it"
          diff -u <(git show FETCH_HEAD:supabase/schema.sql) /tmp/schema-from-migrations.sql || true
          git checkout -B snapshot-update FETCH_HEAD
          cp /tmp/schema-from-migrations.sql supabase/schema.sql
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/schema.sql
          git commit -m "chore(db): regenerate schema.sql from migrations [skip ci]"
          if ! git push origin snapshot-update:dev; then
            echo "::warning::lost a race pushing the regenerated schema.sql to dev; the next schema-changing push will regenerate it"
          fi

      # No `supabase stop`: the runner is ephemeral and gets destroyed right after
      # this job, so tearing the stack down (~19s) protected nothing. The schema
      # snapshot above is dumped while the stack is still up either way.

  # Deploy job only runs on push to main, after CI passes
  # Vercel handles preview/staging deploys for dev automatically via GitHub integration
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test, test-db, build-smoke]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: production
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - name: Push migrations to Supabase
        run: |
          supabase link --project-ref ${{ secrets.SUPABASE_PROD_PROJECT_REF }}
          supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

