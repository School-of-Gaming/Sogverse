name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# Single source of truth for the Supabase CLI version used by every job below.
# Pinned (not `latest`) on purpose: `latest` makes supabase/setup-cli resolve the
# newest release via the GitHub API at runtime, and that lookup intermittently
# rate-limits / times out / hangs — which is a CI flake unrelated to our code.
# This must stay >= the v2.106.0 floor the DB-grants regime depends on (see
# CLAUDE.md "Function & Table Access Control"). Bump it when the local dev CLI is
# upgraded (keep CI == what we run migrations against locally); check the newest
# stable with `gh api repos/supabase/cli/releases/latest`.
env:
  SUPABASE_CLI_VERSION: "2.106.0"

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Check translations
        run: npm run check-translations

      - name: Run linting
        run: npm run lint

      - name: Run type check
        run: npm run type-check

  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test -- --coverage

      - name: Upload coverage reports
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # CI runs chromium only. `--with-deps` for webkit intermittently hangs for
      # 10-20 min on GitHub-hosted runners (apt-get hits slow/unhealthy mirrors for
      # webkit's system libs) — a known, unresolved upstream issue. Installing just
      # chromium sidesteps that path. The full engine matrix (firefox/webkit/mobile)
      # still lives in playwright.config.ts for local runs; CI scopes to chromium
      # via --project below. Revisit cross-browser when the e2e suite is hardened.
      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Build application
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_DAILY_DOMAIN: ${{ secrets.NEXT_PUBLIC_DAILY_DOMAIN }}
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}

      - name: Run E2E tests
        run: npm run test:e2e -- --project=chromium
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_DAILY_DOMAIN: ${{ secrets.NEXT_PUBLIC_DAILY_DOMAIN }}
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}

      - name: Upload Playwright report
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  test-db:
    name: Database Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      # The DB tests only exercise Postgres via PostgREST + GoTrue (see
      # tests/db/helpers.ts) — they never touch edge functions, studio, imgproxy,
      # vector, or logflare. Excluding those avoids booting the edge-runtime
      # container, whose boot-time Deno download intermittently fails the tail-end
      # health check with `Error status 502` (known upstream flake: supabase/cli
      # #3775, #2893, #4535) and fails the whole job on a stack the tests don't use.
      # --ignore-health-check is the documented backstop for that 502; the kept
      # containers come up fine. Also cuts start time from ~5 min to ~40-60s.
      # (realtime/storage/inbucket are unused too and could be excluded for more
      # speed, but they're not the flaky one, so we keep them — minimal blast radius.)
      - name: Start local Supabase
        run: supabase start -x edge-runtime,studio,imgproxy,vector,logflare --ignore-health-check

      - name: Run database tests
        run: npm run test:db
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0
          SUPABASE_SERVICE_ROLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU

      # supabase/schema.sql is regenerated here, from the stack `supabase start`
      # just built out of migrations/ — not dumped from any long-lived database.
      # That is the whole point: a hosted database can be (and has been) edited
      # outside migrations, and dumping the snapshot from one lets that drift into
      # the committed file, where it then reads as authoritative. Built from
      # migrations, the snapshot is faithful by construction.
      #
      # The dump goes through the CLI rather than the runner's pg_dump so the
      # client version always matches the server the CLI booted; a host pg_dump
      # older than the container's Postgres refuses to run at all.
      - name: Regenerate schema snapshot from migrations
        run: supabase db dump --local --schema public -f /tmp/schema-from-migrations.sql

      - name: Upload regenerated snapshot
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: schema-from-migrations
          path: /tmp/schema-from-migrations.sql
          retention-days: 30

      - name: Verify committed schema.sql matches migrations
        run: |
          if ! diff -u supabase/schema.sql /tmp/schema-from-migrations.sql; then
            echo "::error::supabase/schema.sql does not match what migrations/ produces."
            echo "Download the 'schema-from-migrations' artifact from this run and commit it as supabase/schema.sql."
            exit 1
          fi

      - name: Stop local Supabase
        if: always()
        run: supabase stop

  # Deploy job only runs on push to main, after CI passes
  # Vercel handles preview/staging deploys for dev automatically via GitHub integration
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test, test-db, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: production
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - name: Push migrations to Supabase
        run: |
          supabase link --project-ref ${{ secrets.SUPABASE_PROD_PROJECT_REF }}
          supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

