<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Picture uploader</title>
  </head>
  <body>
    <main id="drop">
      <h1 id="heading">Picture</h1>
      <p id="subject" class="quiet">Waiting for Sogverse…</p>

      <label class="field">
        <span id="file-label">Picture</span>
        <input id="file" type="file" accept="image/*" disabled />
        <span id="file-hint" class="quiet hint"></span>
      </label>

      <ol id="files" hidden></ol>

      <div class="actions">
        <button id="upload" type="button" disabled>Upload</button>
      </div>

      <p id="status" role="status" aria-live="polite"></p>
    </main>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
