<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Uploader</title>
  </head>
  <body>
    <main>
      <h1 id="heading">Upload</h1>
      <p id="subject" class="quiet">Waiting for Sogverse…</p>

      <label class="field">
        <span id="file-caption">File</span>
        <input id="file" type="file" disabled />
      </label>

      <figure id="preview" hidden>
        <img id="preview-image" alt="The picture as it will be saved" />
        <figcaption id="preview-note" class="quiet"></figcaption>
      </figure>

      <p id="file-note" class="quiet" hidden></p>

      <label id="label-field" class="field" hidden>
        <span>Label</span>
        <input id="label" type="text" maxlength="200" disabled />
      </label>

      <div class="actions">
        <button id="upload" type="button" disabled>Upload</button>
      </div>

      <p id="status" role="status" aria-live="polite"></p>
    </main>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
