<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Uploader</title>
  </head>
  <body>
    <main id="drop">
      <h1 id="heading">Upload</h1>
      <p id="subject" class="quiet">Waiting for Sogverse…</p>

      <label class="field">
        <span id="file-caption">File</span>
        <input id="file" type="file" disabled />
        <span id="file-hint" class="quiet hint" hidden></span>
      </label>

      <ol id="files" hidden></ol>

      <p id="file-note" class="quiet" hidden></p>

      <div class="actions">
        <button id="upload" type="button" disabled>Upload</button>
      </div>

      <p id="status" role="status" aria-live="polite"></p>
      <progress id="progress" aria-label="Pictures uploaded" hidden></progress>
    </main>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
