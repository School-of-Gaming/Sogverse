    <style rel="stylesheet" crossorigin>*,*:before,*:after{box-sizing:border-box}html{color-scheme:dark}body{margin:0;background:var(--background);color:var(--foreground);font-family:var(--font-sans);font-size:14px;line-height:1.5}main{display:flex;flex-direction:column;gap:12px;padding:16px}h1{margin:0;font-size:16px;font-weight:600}p{margin:0}.quiet{color:var(--muted-foreground)}.field{display:flex;flex-direction:column;gap:4px}.field>span{font-size:12px;font-weight:500;color:var(--muted-foreground)}input[type=text]{padding:8px 10px;border:1px solid var(--border);border-radius:6px;background:var(--card);color:var(--foreground);font:inherit}input[type=file]{font:inherit;color:var(--muted-foreground)}figure{margin:0;display:flex;flex-direction:column;gap:4px}figure img{display:block;width:100%;aspect-ratio:16 / 9;border:1px solid var(--border);border-radius:6px}.actions{display:flex;justify-content:flex-end}button{padding:8px 16px;border:0;border-radius:6px;background:var(--act);color:var(--act-foreground);font:inherit;font-weight:600;cursor:pointer}button:disabled{opacity:.5;cursor:default}#status:empty{display:none}#status[data-tone=error]{color:var(--destructive)}[hidden]{display:none!important}</style>

    <main>
      <h1>Library cover</h1>
      <p id="article" class="quiet">Waiting for the article…</p>

      <label class="field">
        <span>Picture</span>
        <input id="file" type="file" accept="image/*" disabled />
      </label>

      <figure id="preview" hidden>
        <img id="preview-image" alt="The cover as it will be saved" />
        <figcaption id="preview-note" class="quiet"></figcaption>
      </figure>

      <label class="field">
        <span>Label</span>
        <input id="label" type="text" maxlength="200" disabled />
      </label>

      <div class="actions">
        <button id="upload" type="button" disabled>Upload and set as cover</button>
      </div>

      <p id="status" role="status" aria-live="polite"></p>
    </main>
  </body>
</html>
