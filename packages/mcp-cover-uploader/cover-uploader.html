<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Library cover</title>
  </head>
  <body>
    <main>
      <h1>Library cover</h1>
      <p id="article" class="quiet">Waiting for the article…</p>

      <label class="field">
        <span>Picture</span>
        <input id="file" type="file" accept="image/*" disabled />
      </label>

      <figure id="preview" hidden>
        <img id="preview-image" alt="The cover as it will be saved" />
        <figcaption id="preview-note" class="quiet"></figcaption>
      </figure>

      <label class="field">
        <span>Label</span>
        <input id="label" type="text" maxlength="200" disabled />
      </label>

      <div class="actions">
        <button id="upload" type="button" disabled>Upload and set as cover</button>
      </div>

      <p id="status" role="status" aria-live="polite"></p>
    </main>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
