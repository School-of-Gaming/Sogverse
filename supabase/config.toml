# Supabase local development configuration
# See: https://supabase.com/docs/guides/cli/config

project_id = "dbcozhkmfsczwgduizkg"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
# Fail-closed is the design: a new object gets no Data API access until a migration
# grants it. What enforces that everywhere is the baseline migration's `ALTER DEFAULT
# PRIVILEGES … REVOKE`, which travels with the schema — a hosted project never reads
# this file. The CLI's own default flipped to true in 2.116, so this pin is defence in
# depth: it keeps a fresh local or CI stack from carrying the permissive defaults over
# the window between bootstrap and the baseline applying.
auto_expose_new_tables = false

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[local_smtp]
enabled = true
port = 54324
smtp_port = 54325
pop3_port = 54326

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
# A worktree's dev server runs on whatever port was free, so localhost is allowed on any
# port: `*` matches any run of characters short of `.` or `/`, which is exactly a port.
# 127.0.0.1 needs no entry of its own — GoTrue accepts any redirect on site_url's host.
additional_redirect_urls = ["http://127.0.0.1:3000/**", "http://localhost:3000/**", "http://localhost:*/**"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false
secure_password_change = true
max_frequency = "1s"
otp_expiry = 3600  # 1 hour. Was bumped to 72h only so admin-generated gedu invite links survived a weekend; that invite flow is gone (gedus self-register at /register-gedu), so this is back to a safe credential-reset window. Shared across all email OTPs (password reset, magic link).

[auth.sms]
enable_signup = false
enable_confirmations = false

[auth.external.apple]
enabled = false

[auth.external.google]
# Off in this file, and it must stay off here: CI's `supabase start` and every `db push`
# read it with nothing set, and an enabled provider whose env() is unset still starts —
# it just sends Google the literal text "env(...)" as its client id. `npm run db -- up`
# turns it on for a local stack when .env.local carries both variables, by handing the
# CLI SUPABASE_AUTH_EXTERNAL_GOOGLE_ENABLED=true, which overrides this key; `up` prints
# the stack's callback URI, whose port is per stack. `redirect_uri` stays unset: the CLI
# defaults it to that callback.
enabled = false
client_id = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET)"

[analytics]
enabled = false
port = 54327
backend = "postgres"

# Environment-specific overrides
# Root config above is used for local dev (supabase start)
# Remotes override only the settings that differ per environment

[remotes.production]
project_id = "yoqkelsopqsksqrkrorx"

[remotes.production.auth]
site_url = "https://sogverse.sog.gg"
additional_redirect_urls = ["https://sogverse.sog.gg/**"]

[remotes.staging]
project_id = "dbcozhkmfsczwgduizkg"

[remotes.staging.auth]
site_url = "https://sogverse-staging.sog.gg"
additional_redirect_urls = ["https://sogverse-staging.sog.gg/**"]
