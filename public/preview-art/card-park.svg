<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="300" height="200" role="img" aria-label="A sunlit park map seen from above">
  <!-- Preview-scene demo art. The BRIGHT one, and deliberately brightest at
       the BOTTOM-LEFT: that is the corner the overlay variant parks its chips
       in, so this is the card that proves a `bg-background` pill still reads
       against near-white. Never rendered by the live app; hardcoded hex is
       fine in an image file. -->
  <defs>
    <linearGradient id="lawn" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#f7fbe4"/>
      <stop offset="0.45" stop-color="#d8f0a8"/>
      <stop offset="1" stop-color="#8fd07a"/>
    </linearGradient>
  </defs>
  <rect width="300" height="200" fill="url(#lawn)"/>
  <!-- sunlit wash over the lower-left corner -->
  <path d="M0 96l150 104H0z" fill="#ffffff" opacity="0.55"/>
  <!-- pond -->
  <ellipse cx="232" cy="58" rx="56" ry="34" fill="#7ec8e8"/>
  <ellipse cx="232" cy="52" rx="42" ry="22" fill="#a5dcf1"/>
  <!-- paths -->
  <g stroke="#e8d9a8" stroke-width="14" fill="none" stroke-linecap="round">
    <path d="M-6 156C60 150 84 108 148 106s96 26 162 8"/>
    <path d="M96 206C104 158 76 132 30 118"/>
  </g>
  <g stroke="#fff6dd" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.8">
    <path d="M-6 156C60 150 84 108 148 106s96 26 162 8"/>
  </g>
  <!-- trees -->
  <g>
    <circle cx="58" cy="60" r="22" fill="#4f9e50"/>
    <circle cx="52" cy="54" r="14" fill="#69bb64"/>
    <circle cx="112" cy="42" r="16" fill="#4f9e50"/>
    <circle cx="108" cy="38" r="10" fill="#69bb64"/>
    <circle cx="186" cy="150" r="20" fill="#4f9e50"/>
    <circle cx="181" cy="145" r="12" fill="#69bb64"/>
    <circle cx="256" cy="168" r="15" fill="#4f9e50"/>
    <circle cx="252" cy="164" r="9" fill="#69bb64"/>
  </g>
  <!-- benches and a picnic blanket -->
  <g fill="#b98a52">
    <rect x="132" y="126" width="26" height="6" rx="2"/>
    <rect x="204" y="98" width="26" height="6" rx="2"/>
  </g>
  <g>
    <rect x="30" y="168" width="44" height="28" rx="4" fill="#f28b82"/>
    <path d="M30 182h44M52 168v28" stroke="#ffffff" stroke-width="4" opacity="0.75"/>
  </g>
  <!-- map pin -->
  <path d="M150 60c9 0 16 7 16 16 0 12-16 26-16 26s-16-14-16-26c0-9 7-16 16-16z" fill="#ef5350"/>
  <circle cx="150" cy="76" r="6" fill="#ffffff"/>
</svg>
