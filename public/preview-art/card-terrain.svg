<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="300" height="200" role="img" aria-label="Blocky voxel terrain under a daytime sky">
  <!-- Preview-scene demo art. Stands in for a product photo on the shop
       browse scene; never rendered by the live app. Hardcoded hex is fine
       here — this file is an image, not UI. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#63b3f0"/>
      <stop offset="1" stop-color="#bfe4fb"/>
    </linearGradient>
  </defs>
  <rect width="300" height="200" fill="url(#sky)"/>
  <circle cx="248" cy="38" r="18" fill="#ffe27a"/>
  <g fill="#ffffff" opacity="0.85">
    <rect x="30" y="34" width="46" height="10"/>
    <rect x="40" y="26" width="26" height="10"/>
    <rect x="120" y="52" width="38" height="9"/>
  </g>
  <!-- back ridge -->
  <g fill="#3f7a46">
    <rect x="0" y="104" width="60" height="96"/>
    <rect x="60" y="92" width="60" height="108"/>
    <rect x="120" y="112" width="60" height="88"/>
    <rect x="180" y="96" width="60" height="104"/>
    <rect x="240" y="116" width="60" height="84"/>
  </g>
  <g fill="#57a05f">
    <rect x="0" y="104" width="60" height="10"/>
    <rect x="60" y="92" width="60" height="10"/>
    <rect x="120" y="112" width="60" height="10"/>
    <rect x="180" y="96" width="60" height="10"/>
    <rect x="240" y="116" width="60" height="10"/>
  </g>
  <!-- front terrace, one block = 20px -->
  <g fill="#6b4a2f">
    <rect x="0" y="150" width="120" height="50"/>
    <rect x="120" y="138" width="80" height="62"/>
    <rect x="200" y="158" width="100" height="42"/>
  </g>
  <g fill="#6cbf6f">
    <rect x="0" y="150" width="120" height="12"/>
    <rect x="120" y="138" width="80" height="12"/>
    <rect x="200" y="158" width="100" height="12"/>
  </g>
  <!-- water pool -->
  <rect x="212" y="170" width="66" height="20" fill="#2f7fd0"/>
  <rect x="212" y="170" width="66" height="5" fill="#54a2ea"/>
  <!-- tree -->
  <rect x="146" y="106" width="12" height="34" fill="#5c3d24"/>
  <g fill="#2f8a45">
    <rect x="126" y="80" width="52" height="14"/>
    <rect x="134" y="66" width="36" height="14"/>
    <rect x="126" y="94" width="52" height="14"/>
  </g>
  <!-- torch-lit block -->
  <rect x="52" y="130" width="20" height="20" fill="#8a5c39"/>
  <rect x="58" y="120" width="6" height="12" fill="#c98b4b"/>
  <rect x="56" y="114" width="10" height="8" fill="#ffcf5c"/>
  <!-- grid seams, so it reads voxel rather than flat -->
  <g stroke="#000000" stroke-opacity="0.08" stroke-width="1">
    <path d="M20 150V200M40 150V200M60 150V200M80 150V200M100 150V200M140 138V200M160 138V200M180 138V200M220 158V200M240 158V200M260 158V200M280 158V200"/>
    <path d="M0 170H120M120 178H200M200 178H300"/>
  </g>
</svg>
